- job: macos
  pool:
    name: ARM64
  variables:
    upload: $(Build.ArtifactStagingDirectory)
    MACOSX_DEPLOYMENT_TARGET: 10.9
  steps:
    - bash: |
        set -ex
        git submodule update --init --recursive
        mkdir build
        cd build
        export FC="gfortran-16"
        cmake .. -DCMAKE_OSX_ARCHITECTURES="arm64"
        make all coin-versions -j2
        make test || true
      displayName: Build package
    - bash: |
        set -ex
        bash package-solvers.sh build "$UPLOAD/macos" macos-arm64
      displayName: Upload package
    - task: InstallAppleCertificate@2
      name: macosCertificate
      inputs:
        certSecureFile: 'Developer ID Application- AMPL Optimization Inc. (ZNNBG5892S).p12'
        certPwd: '$(certPwd)'
        keychain: 'temp'
        opensslPkcsArgs: '-legacy'
        setUpPartitionIdACLForPrivateKey: true
      displayName: Install Apple signing certificate
    - bash: bash package/prepare-signing-keychain.sh
      env:
        MACOS_SIGNING_IDENTITY: $(macosCertificate.signingIdentity)
        MACOS_SIGNING_KEYCHAIN: $(macosCertificate.keychainPath)
      displayName: Install and verify Apple signing certificate chain
    - bash: |
        set -e
        security list-keychains -d user
        security find-identity -v -p codesigning
        security find-identity -v -p codesigning "$IMPORTED_KEYCHAIN"
      env:
        IMPORTED_KEYCHAIN: $(macosCertificate.keychainPath)
      displayName: Inspect macOS signing keychains
    - bash: |
        set -e
        bash package-solvers.sh build "$UPLOAD/macos" macos-arm64 --signed
      env:
        MACOS_SIGNING_IDENTITY: $(macosCertificate.signingIdentity)
        MACOS_SIGNING_KEYCHAIN: $(macosCertificate.keychainPath)
      displayName: Sign and package macOS solvers
    - task: PublishBuildArtifacts@1
      inputs: {pathtoPublish: '$(Build.ArtifactStagingDirectory)'}
- job: windows
  # Match the Visual Studio 17 2022 generator used below.
  pool: {vmImage: 'windows-2022'}
  strategy:
    matrix:
      x64:
        arch: 'x64'
        nbits: 64
  variables:
    upload: $(Build.ArtifactStagingDirectory)
  steps:
    - script: |
        choco uninstall mingw
        choco install mingw --x86 -y
        choco install make --x86 -y
      condition: eq(variables['arch'], 'win32')
      displayName: Install mingw
    - bash: |
        set -ex
        git submodule update --init --recursive
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A $ARCH -DARCH=$NBITS -DCOIN_DISABLE_WARNINGS=1 -DCMAKE_SH="CMAKE_SH-NOTFOUND"
        cmake --build . -t ALL_BUILD coin-versions -j 2 --config Release
        ctest -C Release || true
        ls -l Release
      displayName: Build package
    - bash: |
        set -ex
        bash package-solvers.sh build "$UPLOAD/win$NBITS" "mswin$NBITS"
      displayName: Upload package
    - task: PublishBuildArtifacts@1
      inputs: {pathtoPublish: '$(Build.ArtifactStagingDirectory)'}
