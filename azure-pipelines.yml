- job: macos
  pool:
    name: ARM64
  variables:
    upload: $(Build.ArtifactStagingDirectory)
    MACOSX_DEPLOYMENT_TARGET: 10.9
  steps:
    - bash: |
        set -ex
        git submodule update --init --recursive --remote
        mkdir build
        cd build
        export FC="gfortran-16"
        cmake .. -DCMAKE_OSX_ARCHITECTURES="arm64"
        make all coin-versions -j2
        make test || true
        make ampl-module
      displayName: Build package
    - bash: |
        set -ex
        # coin-module.macos64.tar.gz
        cp build/ampl-module/* $UPLOAD/
      displayName: Collect package
    - task: PublishBuildArtifacts@1
      inputs: {pathtoPublish: '$(Build.ArtifactStagingDirectory)'}
- job: windows
  pool: {vmImage: 'windows-latest'}
  strategy:
    matrix:
      x64:
        arch: 'x64'
        nbits: 64
  variables:
    upload: $(Build.ArtifactStagingDirectory)
  steps:
    - script: |
        choco uninstall mingw
        choco install mingw --x86 -y
        choco install make --x86 -y
      condition: eq(variables['arch'], 'win32')
      displayName: Install mingw
    - bash: |
        set -ex
        git submodule update --init --recursive --remote
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A $ARCH -DARCH=$NBITS -DCOIN_DISABLE_WARNINGS=1 -DCMAKE_SH="CMAKE_SH-NOTFOUND"
        cmake --build . -t ALL_BUILD coin-versions -j 2 --config Release
        ctest -C Release || true
        ls -l Release
        cmake --build . --target ampl-module --config Release
      displayName: Build package
    - bash: |
        set -ex
        # coin-module.mswin64.zip
        cp build/ampl-module/* $UPLOAD/
      displayName: Collect package
    - task: PublishBuildArtifacts@1
      inputs: {pathtoPublish: '$(Build.ArtifactStagingDirectory)'}
