variables:
  DECODE_PERCENTS: false
  # Azure-pipelines: [warning]%25 detected in ##vso command. In March 2021, the agent command parser will be updated to unescape this to %. To opt out of this behavior, set a job level variable DECODE_PERCENTS to false. Setting to true will force this behavior immediately. More information can be found at https://github.com/microsoft/azure-pipelines-agent/blob/master/docs/design/percentEncoding.md

jobs:
- job: linux
  pool: {vmImage: 'Ubuntu-latest'}
  strategy:
    matrix:
      x64:
        image: 'quay.io/pypa/manylinux_2_28_x86_64'
        nbits: 64
  variables:
    upload: $(Build.ArtifactStagingDirectory)/release/coin
  steps:
    - bash: |
        lscpu | grep -E '^Thread|^Core|^Socket|^CPU\('
        cat /proc/cpuinfo
      displayName: Check CPU
    - bash: |
        set -ex
        BUILD_DIR=manylinux/linux-intel$NBITS/
        git submodule update --init --recursive
        mkdir -p $BUILD_DIR/*
        rm -rf $BUILD_DIR/*
        docker run -v `pwd`:/base --rm $IMAGE /base/manylinux/build.sh `nproc` intel$NBITS $NBITS
      displayName: Build package
    - bash: |
        set -ex
        BUILD_DIR=manylinux/linux-intel$NBITS/
        bash package-solvers.sh "$BUILD_DIR" "$UPLOAD" "linux-intel$NBITS"
      displayName: Upload package
    - task: PublishBuildArtifacts@1
      inputs: {pathtoPublish: '$(Build.ArtifactStagingDirectory)/release'}
- job: linuxarm64
  pool:
    name: ARM64
  variables:
    upload: $(Build.ArtifactStagingDirectory)/release/coin
    image: 'quay.io/pypa/manylinux_2_28_aarch64'
  steps:
    - bash: |
        set -ex
        BUILD_DIR=manylinux/linux-arm64/
        git submodule update --init --recursive
        mkdir -p "$BUILD_DIR"
        rm -rf "$BUILD_DIR"/*
        NPROC=$(getconf _NPROCESSORS_ONLN)
        docker run -v "$(pwd):/base" --rm "$IMAGE" /base/manylinux/build.sh "$NPROC" arm64 64
      displayName: Build package
    - bash: |
        set -ex
        bash package-solvers.sh manylinux/linux-arm64 "$UPLOAD" linux-arm64
      displayName: Upload package
    - task: PublishBuildArtifacts@1
      inputs: {pathtoPublish: '$(Build.ArtifactStagingDirectory)/release'}
- job: macos_intel
  pool: {vmImage: 'macOS-latest'}
  variables:
    upload: $(Build.ArtifactStagingDirectory)/release/coin
    MACOSX_DEPLOYMENT_TARGET: 10.9
  steps:
    - script: |
        brew install gcc
      displayName: Install gcc (installs gfortran too)
    - bash: |
        set -ex
        git submodule update --init --recursive
        mkdir build
        cd build
        export FC="gfortran-15"
        cmake .. -DARCH=64 -DCMAKE_OSX_ARCHITECTURES="x86_64"
        make all coin-versions -j2
        make test || true
      displayName: Build package
    # Packaged (and signed) later, once combined with the arm64 build.
    - bash: bash package/macos-stage.sh build "$(Build.ArtifactStagingDirectory)/macos-x86_64"
      displayName: Stage build
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/macos-x86_64'
        artifact: 'macos-x86_64'
- job: macos_arm64
  pool:
    name: ARM64
  variables:
    MACOSX_DEPLOYMENT_TARGET: 10.9
  steps:
    - bash: |
        set -ex
        git submodule update --init --recursive
        mkdir build
        cd build
        export FC="gfortran-16"
        cmake .. -DCMAKE_OSX_ARCHITECTURES="arm64"
        make all coin-versions -j2
        make test || true
      displayName: Build package
    - bash: bash package/macos-stage.sh build "$(Build.ArtifactStagingDirectory)/macos-arm64"
      displayName: Stage build
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/macos-arm64'
        artifact: 'macos-arm64'
- job: macos
  displayName: Universal macOS package
  dependsOn:
    - macos_intel
    - macos_arm64
  # Runs on the ARM64 pool, where the signing certificate is available.
  pool:
    name: ARM64
  variables:
    upload: $(Build.ArtifactStagingDirectory)/release/coin
  steps:
    - checkout: self
    - task: DownloadPipelineArtifact@2
      inputs:
        artifactName: 'macos-arm64'
        targetPath: '$(Pipeline.Workspace)/macos-arm64'
    - task: DownloadPipelineArtifact@2
      inputs:
        artifactName: 'macos-x86_64'
        targetPath: '$(Pipeline.Workspace)/macos-x86_64'
    - bash: |
        set -ex
        bash package/macos-lipo.sh "$(Pipeline.Workspace)/macos-arm64" \
          "$(Pipeline.Workspace)/macos-x86_64" "$(Pipeline.Workspace)/macos-universal"
        # Unsigned archives (including the Cbc libraries), then the signed ones.
        bash package-solvers.sh "$(Pipeline.Workspace)/macos-universal" "$UPLOAD" macos64
      displayName: Create universal binaries
    - task: InstallAppleCertificate@2
      name: macosCertificate
      inputs:
        certSecureFile: 'Developer ID Application- AMPL Optimization Inc. (ZNNBG5892S).p12'
        certPwd: '$(certPwd)'
        keychain: 'temp'
        opensslPkcsArgs: '-legacy'
        setUpPartitionIdACLForPrivateKey: true
      displayName: Install Apple signing certificate
    - bash: bash package/prepare-signing-keychain.sh
      env:
        MACOS_SIGNING_IDENTITY: $(macosCertificate.signingIdentity)
        MACOS_SIGNING_KEYCHAIN: $(macosCertificate.keychainPath)
      displayName: Install and verify Apple signing certificate chain
    - bash: |
        set -e
        security list-keychains -d user
        security find-identity -v -p codesigning
        security find-identity -v -p codesigning "$IMPORTED_KEYCHAIN"
      env:
        IMPORTED_KEYCHAIN: $(macosCertificate.keychainPath)
      displayName: Inspect macOS signing keychains
    - bash: |
        set -e
        bash package-solvers.sh "$(Pipeline.Workspace)/macos-universal" "$UPLOAD" macos64 --signed
      env:
        MACOS_SIGNING_IDENTITY: $(macosCertificate.signingIdentity)
        MACOS_SIGNING_KEYCHAIN: $(macosCertificate.keychainPath)
      displayName: Sign and package macOS solvers
    - task: PublishBuildArtifacts@1
      inputs: {pathtoPublish: '$(Build.ArtifactStagingDirectory)/release'}
- job: windows
  # Match the Visual Studio 17 2022 generator used below.
  pool: {vmImage: 'windows-2022'}
  strategy:
    matrix:
      x64:
        arch: 'x64'
        nbits: 64
  variables:
    upload: $(Build.ArtifactStagingDirectory)/release/coin
  steps:
    - script: |
        choco uninstall mingw
        choco install mingw --x86 -y
        choco install make --x86 -y
      condition: eq(variables['arch'], 'win32')
      displayName: Install mingw
    - bash: |
        set -ex
        git submodule update --init --recursive
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A $ARCH -DARCH=$NBITS -DCOIN_DISABLE_WARNINGS=1 -DCMAKE_SH="CMAKE_SH-NOTFOUND"
        cmake --build . -t ALL_BUILD coin-versions -j 2 --config Release
        ctest -C Release || true
        ls -l Release
      displayName: Build package
    - bash: |
        set -ex
        bash package-solvers.sh build "$UPLOAD" "mswin$NBITS"
      displayName: Upload package
    - task: PublishBuildArtifacts@1
      inputs: {pathtoPublish: '$(Build.ArtifactStagingDirectory)/release'}
- job: release
  displayName: Publish release artifacts
  dependsOn:
    - linux
    - linuxarm64
    - macos
    - windows
  condition: always()
  pool: {vmImage: 'ubuntu-latest'}
  steps:
    - checkout: none
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(Build.ArtifactStagingDirectory)/release'
        cleanDestinationFolder: true
      displayName: Download current pipeline artifacts
    - bash: |
        set -e
        mv "$RELEASE_DIR/drop/coin" "$RELEASE_DIR/coin"
        rmdir "$RELEASE_DIR/drop"
      env:
        RELEASE_DIR: $(Build.ArtifactStagingDirectory)/release
      displayName: Arrange release/coin directory
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/release'
        artifact: 'release'
        artifactType: 'pipeline'
      displayName: Publish release
