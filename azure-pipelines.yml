- job: linuxarm
  pool: ARM64
  steps:
  - script: |
      git clone --depth 1 --branch $(HIGHS_TAG) https://github.com/ERGO-Code/HiGHS.git
    displayName: Cloning repository
  - bash: |
      chmod +x build_highs.sh
      ./build_highs.sh arm64
    displayName: Building and packaging ARM64
  - task: CopyFiles@2
    inputs:
        sourceFolder: '$(Build.SourcesDirectory)/HiGHS/build-arm64'
        contents: '*.zip'
        targetFolder: '$(Build.ArtifactStagingDirectory)/arm64'
  - publish: '$(Build.ArtifactStagingDirectory)/arm64'
    artifact: HiGHS-$(HIGHS_TAG)-linux-arm64

- job: linuxarm_gpu
  pool: ARM64
  steps:
  - script: |
      git clone --depth 1 --branch $(HIGHS_TAG) https://github.com/ERGO-Code/HiGHS.git
    displayName: Cloning repository
  - bash: |
      chmod +x build_highs.sh
      ./build_highs.sh arm64-gpu
    displayName: Building and packaging ARM64 with GPU support
  - task: CopyFiles@2
    inputs:
        sourceFolder: '$(Build.SourcesDirectory)/HiGHS/build-arm64-gpu'
        contents: '*.zip'
        targetFolder: '$(Build.ArtifactStagingDirectory)/arm64/gpu'
  - publish: '$(Build.ArtifactStagingDirectory)/arm64'
    artifact: HiGHS-$(HIGHS_TAG)-linux-arm64-gpu

- job: linux
  pool: {vmImage: 'Ubuntu-22.04'}
  steps:
  - script: |
      git clone --depth 1 --branch $(HIGHS_TAG) https://github.com/ERGO-Code/HiGHS.git
    displayName: Cloning repository
  - bash: |
      chmod +x build_highs.sh
      ./build_highs.sh x64
    displayName: Building and packaging Intel 64
  - task: CopyFiles@2
    inputs:
        sourceFolder: '$(Build.SourcesDirectory)/HiGHS/build-x64'
        contents: '*.zip'
        targetFolder: '$(Build.ArtifactStagingDirectory)/x64'
  - publish: '$(Build.ArtifactStagingDirectory)/x64'
    artifact: HiGHS-$(HIGHS_TAG)-linux-x64

- job: linux_gpu
  pool: {vmImage: 'Ubuntu-22.04'}
  steps:
  - script: |
      git clone --depth 1 --branch $(HIGHS_TAG) https://github.com/ERGO-Code/HiGHS.git
    displayName: Cloning repository
  - bash: |
      chmod +x build_highs.sh
      ./build_highs.sh x64-gpu
    displayName: Building and packaging Intel 64 with GPU support
  - task: CopyFiles@2
    inputs:
        sourceFolder: '$(Build.SourcesDirectory)/HiGHS/build-x64-gpu'
        contents: '*.zip'
        targetFolder: '$(Build.ArtifactStagingDirectory)/x64/gpu'
  - publish: '$(Build.ArtifactStagingDirectory)/x64'
    artifact: HiGHS-$(HIGHS_TAG)-linux-x64-gpu

- job: macos
  pool:
    vmImage: macOS-latest
  steps:
  - script: |
      git clone --depth 1 --branch $(HIGHS_TAG) https://github.com/ERGO-Code/HiGHS.git
    displayName: Cloning repository
  - bash: |
      chmod +x do_build_highs_mac.sh
      ./do_build_highs_mac.sh build 2 -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64'
    displayName: Compiling and packaging HiGHS Universal
  - task: CopyFiles@2
    inputs:
        sourceFolder: '$(Build.SourcesDirectory)/HiGHS/build'
        contents: '*.zip'
        targetFolder: '$(Build.ArtifactStagingDirectory)'
  - publish: '$(Build.ArtifactStagingDirectory)'
    artifact: HiGHS-$(HIGHS_TAG)-osx64

