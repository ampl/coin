variables:
  DECODE_PERCENTS: false
  # Azure-pipelines: [warning]%25 detected in ##vso command. In March 2021, the agent command parser will be updated to unescape this to %. To opt out of this behavior, set a job level variable DECODE_PERCENTS to false. Setting to true will force this behavior immediately. More information can be found at https://github.com/microsoft/azure-pipelines-agent/blob/master/docs/design/percentEncoding.md

jobs:
- job: linux
  pool: {vmImage: 'Ubuntu-latest'}
  strategy:
    matrix:
      x64:
        image: 'quay.io/pypa/manylinux_2_28_x86_64'
        nbits: 64
  variables:
    upload: $(Build.ArtifactStagingDirectory)
  steps:
    - bash: |
        lscpu | grep -E '^Thread|^Core|^Socket|^CPU\('
        cat /proc/cpuinfo
      displayName: Check CPU
    - bash: |
        set -ex
        BUILD_DIR=manylinux/linux-intel$NBITS/
        git submodule update --init --recursive --remote
        mkdir -p $BUILD_DIR/*
        rm -rf $BUILD_DIR/*
        docker run -v `pwd`:/base --rm $IMAGE /base/manylinux/build.sh `nproc` intel$NBITS $NBITS
      displayName: Build package
    - bash: |
        set -ex
        # coin-module.linux64.tar.gz, produced by the ampl-module target
        # (run inside the container by manylinux/build.sh).
        cp manylinux/linux-intel$NBITS/ampl-module/* $UPLOAD/
      displayName: Collect package
    - task: PublishBuildArtifacts@1
      inputs: {pathtoPublish: '$(Build.ArtifactStagingDirectory)'}
- job: linuxarm64
  pool: {vmImage: 'ubuntu-24.04-arm'}
  variables:
    upload: $(Build.ArtifactStagingDirectory)
    image: 'quay.io/pypa/manylinux_2_28_aarch64'
  steps:
    - bash: |
        set -ex
        BUILD_DIR=manylinux/linux-arm64/
        git submodule update --init --recursive --remote
        mkdir -p $BUILD_DIR/*
        rm -rf $BUILD_DIR/*
        docker run -v `pwd`:/base --rm $IMAGE /base/manylinux/build.sh `nproc` arm64 64
      displayName: Build package
    - bash: |
        set -ex
        # coin-module.linuxarm64.tar.gz
        cp manylinux/linux-arm64/ampl-module/* $UPLOAD/
      displayName: Collect package
    - task: PublishBuildArtifacts@1
      inputs: {pathtoPublish: '$(Build.ArtifactStagingDirectory)'}
