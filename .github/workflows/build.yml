# HiGHS shared libraries, with and without GPU (cuPDLP) support.
# Ported from azure-pipelines.yml; Windows replaces the local
# build_highs_win.bat builds.
name: Build HiGHS

on:
  push:
    branches: [highs]
  pull_request:
    branches: [highs]
  workflow_dispatch:
    inputs:
      highs_tag:
        description: HiGHS tag to build
        type: string
        default: v1.15.1

permissions:
  contents: read

env:
  # inputs are empty on push/pull_request: fall back to the default tag
  HIGHS_TAG: ${{ inputs.highs_tag || 'v1.15.1' }}

jobs:
  linux:
    name: Linux ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # variant = argument of build_highs.sh, which picks the manylinux_2_28
          # image (the CUDA ones for -gpu) and the CMake options
          - variant: x64
            runner: ubuntu-latest
          - variant: x64-gpu
            runner: ubuntu-latest
          - variant: arm64
            runner: ubuntu-24.04-arm
          - variant: arm64-gpu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Clone HiGHS
        run: git clone --depth 1 --branch "$HIGHS_TAG" https://github.com/ERGO-Code/HiGHS.git
      - name: Build and package
        run: bash build_highs.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: HiGHS-${{ env.HIGHS_TAG }}-linux-${{ matrix.variant }}
          path: HiGHS/build-${{ matrix.variant }}/*.zip
          if-no-files-found: error

  # Same configurations as build_highs_win.bat. The GPU build only needs the
  # CUDA toolkit to compile (no GPU on the runner): it is installed here.
  windows:
    name: Windows ${{ matrix.variant }}
    runs-on: windows-2022 # Visual Studio 2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONLY_CBLAS: HiGHS means to set it (FetchContent ignores the CMAKE_ARGS
          # it uses); without it OpenBLAS also builds its utest, whose post-build
          # step copies openblas.dll, which the -ampl postfix renamed
          - variant: x64
            options: -DHIPO=ON -DBUILD_OPENBLAS=ON -DONLY_CBLAS=ON -DCMAKE_RELEASE_POSTFIX=-ampl
          - variant: x64-gpu
            options: -DCUPDLP_GPU=ON -DHIGHS_GPU_LIB=ON -DCMAKE_RELEASE_POSTFIX=-ampl-gpu
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA toolkit
        if: ${{ endsWith(matrix.variant, '-gpu') }}
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.1'
          method: network
          # compiler, cudart/cuBLAS/cuSPARSE (used by cuPDLP) and the MSBuild
          # extensions that let the Visual Studio generator compile .cu files
          sub-packages: '["nvcc", "crt", "nvvm", "cudart", "cublas", "cublas_dev", "cusparse", "cusparse_dev", "nvjitlink", "visual_studio_integration"]'
      - name: Clone HiGHS
        run: git clone --depth 1 --branch "$HIGHS_TAG" https://github.com/ERGO-Code/HiGHS.git
      - name: Compile and package HiGHS
        env:
          CUDA_TOOLKIT: ${{ steps.cuda.outputs.CUDA_PATH }}
        run: |
          set -ex
          cudaoptions=()
          if [ -n "$CUDA_TOOLKIT" ]; then
            # use this toolkit (and its MSBuild extensions) for the .cu files
            cudaoptions=(-T "cuda=$CUDA_TOOLKIT" "-DCMAKE_CUDA_PATH=$CUDA_TOOLKIT")
            nvcc --version || true
          fi
          cmake -S HiGHS -B "HiGHS/build-${{ matrix.variant }}" -G "Visual Studio 17 2022" -A x64 \
            "${cudaoptions[@]}" -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DZLIB=OFF \
            ${{ matrix.options }}
          cmake --build "HiGHS/build-${{ matrix.variant }}" --config Release --target package --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: HiGHS-${{ env.HIGHS_TAG }}-win-${{ matrix.variant }}
          path: HiGHS/build-${{ matrix.variant }}/*.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Clone HiGHS
        run: git clone --depth 1 --branch "$HIGHS_TAG" https://github.com/ERGO-Code/HiGHS.git
      - name: Compile and package HiGHS (arm64 + x86_64)
        run: ./do_build_highs_mac.sh build 2 "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: HiGHS-${{ env.HIGHS_TAG }}-osx64
          path: HiGHS/build/*.zip
          if-no-files-found: error
