# OR-Tools (CP-SAT only) as static libraries, with the dependencies installed
# with it (abseil, protobuf, ...); see ortools_cmake_options.sh for the options.
# Ported from azure-pipelines.yml.
name: Build OR-Tools

on:
  push:
    branches: [ortools]
  pull_request:
    branches: [ortools]
  workflow_dispatch:
    inputs:
      ortools_tag:
        description: OR-Tools tag to build
        type: string
        default: v9.15
      build_macos:
        description: Build macOS
        type: boolean
        default: true
      build_windows:
        description: Build Windows
        type: boolean
        default: true
      build_linux_x64:
        description: Build Linux x64
        type: boolean
        default: true
      build_linux_arm64:
        description: Build Linux ARM64
        type: boolean
        default: true

permissions:
  contents: read

env:
  # inputs are empty on push/pull_request: fall back to the default tag
  ORTOOLS_TAG: ${{ inputs.ortools_tag || 'v9.15' }}

jobs:
  windows:
    name: Windows x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-2022
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Clone OR-Tools
        run: git clone --depth 1 --branch "$ORTOOLS_TAG" https://github.com/google/or-tools.git
      - name: Compile and package OR-Tools
        run: ./do_build_ortools.sh build 2 win64
      - uses: actions/upload-artifact@v4
        with:
          name: ortools-${{ env.ORTOOLS_TAG }}-win64
          path: or-tools/build/*.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux_x64 }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Clone OR-Tools
        run: git clone --depth 1 --branch "$ORTOOLS_TAG" https://github.com/google/or-tools.git
      - name: Build and package (manylinux_2_28 x86_64)
        run: bash build_ortools.sh x64
      - uses: actions/upload-artifact@v4
        with:
          name: ortools-${{ env.ORTOOLS_TAG }}-linux-x64
          path: or-tools/build-x64/*.zip
          if-no-files-found: error

  linuxarm64:
    name: Linux ARM64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux_arm64 }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Clone OR-Tools
        run: git clone --depth 1 --branch "$ORTOOLS_TAG" https://github.com/google/or-tools.git
      # Peaks of the OR-Tools compilation exhaust the runner's memory, which
      # kills the runner ("received a shutdown signal"): add swap to absorb them
      - name: Add swap
        run: |
          set -ex
          free -h; df -h /
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Build and package (manylinux_2_28 aarch64)
        run: bash build_ortools.sh arm64
      - name: Memory and disk usage
        if: ${{ always() }}
        run: free -h; df -h /
      - uses: actions/upload-artifact@v4
        with:
          name: ortools-${{ env.ORTOOLS_TAG }}-linux-arm64
          path: or-tools/build-arm64/*.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Clone OR-Tools
        run: git clone --depth 1 --branch "$ORTOOLS_TAG" https://github.com/google/or-tools.git
      - name: Compile and package OR-Tools (arm64 + x86_64)
        run: ./do_build_ortools.sh build 2 osx64 "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: ortools-${{ env.ORTOOLS_TAG }}-osx64
          path: or-tools/build/*.zip
          if-no-files-found: error
