name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write # smoke test results

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    env:
      IMAGE: quay.io/pypa/manylinux_2_28_x86_64
      NBITS: 64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check CPU
        run: |
          lscpu | grep -E '^Thread|^Core|^Socket|^CPU\('
          cat /proc/cpuinfo
      - name: Build package
        run: |
          set -ex
          BUILD_DIR=manylinux/linux-intel$NBITS/
          mkdir -p $BUILD_DIR
          rm -rf $BUILD_DIR/*
          docker run -v "$(pwd):/base" --rm "$IMAGE" /base/manylinux/build.sh "$(nproc)" intel$NBITS $NBITS
      - name: Package
        run: bash package-solvers.sh manylinux/linux-intel$NBITS/ "$RUNNER_TEMP/release/coin" linux-intel$NBITS
      - uses: actions/upload-artifact@v4
        with:
          name: archives-linux-intel64
          path: ${{ runner.temp }}/release/coin

  linuxarm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build package
        run: |
          set -ex
          BUILD_DIR=manylinux/linux-arm64/
          mkdir -p "$BUILD_DIR"
          rm -rf "$BUILD_DIR"/*
          NPROC=$(getconf _NPROCESSORS_ONLN)
          docker run -v "$(pwd):/base" --rm "$IMAGE" /base/manylinux/build.sh "$NPROC" arm64 64
      - name: Package
        run: bash package-solvers.sh manylinux/linux-arm64 "$RUNNER_TEMP/release/coin" linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: archives-linux-arm64
          path: ${{ runner.temp }}/release/coin

  # The two macOS builds are combined with lipo (and signed) in `macos` below.
  # x86_64 is built natively on an Intel runner, arm64 on an Apple silicon one.
  macos_intel:
    name: macOS x86_64 build
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.9'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install gcc (installs gfortran too)
        run: brew install gcc
      - name: Build package
        run: |
          set -ex
          mkdir build
          cd build
          export FC=$(ls "$(brew --prefix)"/bin/gfortran-* | sort -V | tail -1)
          cmake .. -DARCH=64 -DCMAKE_OSX_ARCHITECTURES="x86_64"
          make all coin-versions -j3
          make test || true
      - name: Stage build
        run: bash package/macos-stage.sh build "$RUNNER_TEMP/macos-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: ${{ runner.temp }}/macos-x86_64

  macos_arm64:
    name: macOS arm64 build
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.9'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install gcc (installs gfortran too)
        run: brew install gcc
      - name: Build package
        run: |
          set -ex
          mkdir build
          cd build
          export FC=$(ls "$(brew --prefix)"/bin/gfortran-* | sort -V | tail -1)
          cmake .. -DCMAKE_OSX_ARCHITECTURES="arm64"
          make all coin-versions -j3
          make test || true
      - name: Stage build
        run: bash package/macos-stage.sh build "$RUNNER_TEMP/macos-arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ runner.temp }}/macos-arm64

  macos:
    name: Universal macOS package
    needs: [macos_intel, macos_arm64]
    runs-on: macos-latest
    env:
      # Signing is skipped (unsigned archives only) when these secrets are unset.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: ${{ runner.temp }}/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: ${{ runner.temp }}/macos-x86_64
      - name: Create universal binaries
        run: |
          set -ex
          bash package/macos-lipo.sh "$RUNNER_TEMP/macos-arm64" \
            "$RUNNER_TEMP/macos-x86_64" "$RUNNER_TEMP/macos-universal"
          # Unsigned archives (including the Cbc libraries), then the signed ones.
          bash package-solvers.sh "$RUNNER_TEMP/macos-universal" "$RUNNER_TEMP/release/coin" macos64
      - name: Install Apple signing certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          set -e
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -t cert -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Add to the search list, keeping the existing keychains.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(.*\)"/\1/p' | head -1)
          [ -n "$identity" ] || { echo "No codesigning identity found" >&2; exit 1; }
          echo "MACOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Install and verify Apple signing certificate chain
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: bash package/prepare-signing-keychain.sh
      - name: Sign and package macOS solvers
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: bash package-solvers.sh "$RUNNER_TEMP/macos-universal" "$RUNNER_TEMP/release/coin" macos64 --signed
      - uses: actions/upload-artifact@v4
        with:
          name: archives-macos
          path: ${{ runner.temp }}/release/coin

  windows:
    name: Windows x64
    runs-on: windows-2022 # matches the Visual Studio 17 2022 generator below
    defaults:
      run:
        shell: bash
    env:
      ARCH: x64
      NBITS: 64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build package
        run: |
          set -ex
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A $ARCH -DARCH=$NBITS -DCOIN_DISABLE_WARNINGS=1 -DCMAKE_SH="CMAKE_SH-NOTFOUND"
          cmake --build . -t ALL_BUILD coin-versions -j 2 --config Release
          ctest -C Release || true
          ls -l Release
      - name: Package
        run: bash package-solvers.sh build "$RUNNER_TEMP/release/coin" "mswin$NBITS"
      - uses: actions/upload-artifact@v4
        with:
          name: archives-windows
          path: ${{ runner.temp }}/release/coin

  # Run the published archives on clean machines, separately from the builds.
  smoke_linux_intel64:
    needs: [linux]
    uses: ./.github/workflows/smoke-test.yml
    with:
      name: Linux x86_64
      runs-on: ubuntu-latest
      platform: linux-intel64
      artifact: archives-linux-intel64
      image: quay.io/pypa/manylinux_2_28_x86_64

  smoke_linux_arm64:
    needs: [linuxarm64]
    uses: ./.github/workflows/smoke-test.yml
    with:
      name: Linux arm64
      runs-on: ubuntu-24.04-arm
      platform: linux-arm64
      artifact: archives-linux-arm64
      image: quay.io/pypa/manylinux_2_28_aarch64

  smoke_macos_arm64:
    needs: [macos]
    uses: ./.github/workflows/smoke-test.yml
    with:
      name: macOS arm64
      runs-on: macos-latest
      platform: macos64
      artifact: archives-macos
      # Test the signed archives when signing is configured, else the unsigned.
      prefix: ${{ vars.MACOS_SIGNED == 'true' && 'signed-' || '' }}

  smoke_macos_intel64:
    needs: [macos]
    uses: ./.github/workflows/smoke-test.yml
    with:
      name: macOS x86_64
      runs-on: macos-15-intel
      platform: macos64
      artifact: archives-macos
      prefix: ${{ vars.MACOS_SIGNED == 'true' && 'signed-' || '' }}

  smoke_windows:
    needs: [windows]
    uses: ./.github/workflows/smoke-test.yml
    with:
      name: Windows
      runs-on: windows-2022
      platform: mswin64
      artifact: archives-windows

  release:
    name: Publish release artifacts
    needs:
      - linux
      - linuxarm64
      - macos
      - windows
      - smoke_linux_intel64
      - smoke_linux_arm64
      - smoke_macos_arm64
      - smoke_macos_intel64
      - smoke_windows
    # Publish whenever the builds succeeded, even if a smoke test failed
    # (matches the old `condition: always()` behaviour for smoke results).
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.linuxarm64.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          merge-multiple: true
          path: ${{ runner.temp }}/release/coin
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
